<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>古诗抽查 - 点击展开 + 滑动缩回 Demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.header {
  position: absolute;
  top: 20px;
  left: 0; right: 0;
  text-align: center;
  z-index: 10;
}
.header h1 { font-size: 18px; color: #94a3b8; }
.header .mode-badge {
  display: inline-block;
  margin-top: 6px;
  padding: 2px 12px;
  border-radius: 12px;
  font-size: 13px;
  transition: all 0.3s;
}
.mode-badge.browse { background: #1e3a5f; color: #60a5fa; }
.mode-badge.recite { background: #3b1f4a; color: #c084fc; }

.swiper-container {
  width: 100%;
  height: 70vh;
  position: relative;
}

/* 所有 slide 默认 65% 宽度 */
.swiper-slide {
  width: 65% !important;
  height: 100%;
  transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

/* 展开的 slide 全宽 */
.swiper-slide.expanded {
  width: 100% !important;
}

/* 卡片样式 */
.card {
  width: 100%;
  height: 100%;
  border-radius: 20px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* PoemCard 浏览卡片 */
.poem-card {
  background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
  border: 1px solid rgba(148, 163, 184, 0.15);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 32px;
}
.poem-card .title {
  font-size: 28px;
  font-weight: 700;
  color: #f1f5f9;
  letter-spacing: 2px;
}
.poem-card .author {
  font-size: 16px;
  color: #94a3b8;
}
.poem-card .hint {
  font-size: 14px;
  color: #64748b;
  margin-top: 8px;
}
.poem-card .tap-hint {
  position: absolute;
  bottom: 20px;
  font-size: 12px;
  color: #475569;
}

/* RecitationCard 背诵卡片 */
.recite-card {
  background: linear-gradient(135deg, #1a1a2e 0%, #2d1b42 100%);
  border: 1px solid rgba(192, 132, 252, 0.2);
  padding: 24px;
  display: flex;
  flex-direction: column;
}
.recite-card .recite-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.recite-card .recite-title {
  font-size: 20px;
  font-weight: 600;
  color: #c084fc;
}
.recite-card .back-btn {
  padding: 6px 16px;
  border-radius: 8px;
  background: rgba(192, 132, 252, 0.15);
  color: #c084fc;
  border: none;
  font-size: 13px;
  cursor: pointer;
}
.recite-card .poem-lines {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.poem-line {
  font-size: 18px;
  padding: 10px 16px;
  border-radius: 10px;
  background: rgba(255,255,255,0.05);
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  letter-spacing: 1px;
}
.poem-line:hover { background: rgba(255,255,255,0.1); }
.poem-line.marked-ok {
  background: rgba(34, 197, 94, 0.15);
  color: #4ade80;
  border-left: 3px solid #22c55e;
}
.poem-line.marked-stuck {
  background: rgba(234, 179, 8, 0.15);
  color: #facc15;
  border-left: 3px solid #eab308;
}
.poem-line.marked-forgot {
  background: rgba(239, 68, 68, 0.15);
  color: #f87171;
  border-left: 3px solid #ef4444;
}

.recite-card .recite-footer {
  display: flex;
  gap: 10px;
  margin-top: 16px;
  justify-content: center;
}
.recite-card .submit-btn {
  padding: 10px 32px;
  border-radius: 12px;
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  color: white;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
}
.recite-card .submit-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* 过渡遮罩 */
.transition-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  background: rgba(0,0,0,0.3);
}
.transition-overlay.active {
  opacity: 1;
}

/* 底部进度 */
.progress-bar {
  position: absolute;
  bottom: 30px;
  left: 0; right: 0;
  text-align: center;
  z-index: 10;
  font-size: 14px;
  color: #64748b;
}
</style>
</head>
<body>

<div class="header">
  <h1>古诗抽查</h1>
  <span id="modeBadge" class="mode-badge browse">浏览模式</span>
</div>

<div class="swiper-container">
  <div class="swiper" id="mainSwiper">
    <div class="swiper-wrapper" id="swiperWrapper">
      <!-- Slides generated by JS -->
    </div>
  </div>
</div>

<div class="progress-bar" id="progressBar">1 / 5</div>
<div class="transition-overlay" id="overlay"></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
const poems = [
  { id: 1, title: '静夜思', author: '李白', dynasty: '唐', lines: ['床前明月光','疑是地上霜','举头望明月','低头思故乡'] },
  { id: 2, title: '春晓', author: '孟浩然', dynasty: '唐', lines: ['春眠不觉晓','处处闻啼鸟','夜来风雨声','花落知多少'] },
  { id: 3, title: '咏鹅', author: '骆宾王', dynasty: '唐', lines: ['鹅鹅鹅','曲项向天歌','白毛浮绿水','红掌拨清波'] },
  { id: 4, title: '登鹳雀楼', author: '王之涣', dynasty: '唐', lines: ['白日依山尽','黄河入海流','欲穷千里目','更上一层楼'] },
  { id: 5, title: '悯农', author: '李绅', dynasty: '唐', lines: ['锄禾日当午','汗滴禾下土','谁知盘中餐','粒粒皆辛苦'] },
];

let viewMode = 'swiper'; // 'swiper' | 'recite'
let swiper = null;
let currentLineMarks = {}; // poemId -> { lineIdx: 'ok'|'stuck'|'forgot' }
let expandedSlideIndex = -1; // 当前展开的 slide 索引，-1 表示没有展开

function getPoemBySlideIndex(slideIndex) {
  const slide = swiper.slides[slideIndex];
  if (!slide) return null;
  const poemId = parseInt(slide.dataset.poemId);
  return poems.find(p => p.id === poemId) || null;
}

function createPoemCardHTML(poem) {
  return `
    <div class="card poem-card" data-poem-id="${poem.id}">
      <div class="title">${poem.title}</div>
      <div class="author">〔${poem.dynasty}〕${poem.author}</div>
      <div class="hint">${poem.lines[0]}...</div>
      <div class="tap-hint">点击进入背诵</div>
    </div>
  `;
}

function createReciteCardHTML(poem) {
  const marks = currentLineMarks[poem.id] || {};
  const allMarked = poem.lines.every((_, i) => marks[i]);
  const linesHTML = poem.lines.map((line, i) => {
    const mark = marks[i];
    const cls = mark ? `marked-${mark}` : '';
    return `<div class="poem-line ${cls}" data-poem-id="${poem.id}" data-line="${i}">${line}</div>`;
  }).join('');

  return `
    <div class="card recite-card" data-poem-id="${poem.id}">
      <div class="recite-header">
        <span class="recite-title">${poem.title}</span>
        <button class="back-btn" id="backBtn">← 返回浏览</button>
      </div>
      <div class="poem-lines">${linesHTML}</div>
      <div class="recite-footer">
        <button class="submit-btn" id="submitBtn" ${!allMarked ? 'disabled' : ''}>提交</button>
      </div>
    </div>
  `;
}

function renderSlides() {
  const wrapper = document.getElementById('swiperWrapper');
  wrapper.innerHTML = poems.map(poem =>
    `<div class="swiper-slide" data-poem-id="${poem.id}">${createPoemCardHTML(poem)}</div>`
  ).join('');
}

function initSwiper() {
  swiper = new Swiper('#mainSwiper', {
    effect: 'coverflow',
    grabCursor: true,
    centeredSlides: true,
    slidesPerView: 'auto',
    loop: true,
    loopAdditionalSlides: 2,
    speed: 300,
    coverflowEffect: {
      rotate: 0,
      stretch: 30,
      depth: 150,
      modifier: 1,
      scale: 1,
      slideShadows: false,
    },
    freeMode: { enabled: true, sticky: true, minimumVelocity: 0.2 },
    on: {
      // 滑动开始：如果有展开的卡片，缩回
      touchStart() {
        if (expandedSlideIndex !== -1) {
          collapseSlide(expandedSlideIndex);
        }
      },
      slideChangeTransitionEnd() {
        updateProgress();
      }
    }
  });
}

// 展开 slide：切换为 RecitationCard + 全宽
function expandSlide(slideIndex) {
  const slide = swiper.slides[slideIndex];
  const poem = getPoemBySlideIndex(slideIndex);
  if (!poem) return;

  expandedSlideIndex = slideIndex;
  viewMode = 'recite';
  updateModeBadge();

  const overlay = document.getElementById('overlay');
  overlay.classList.add('active');

  slide.innerHTML = createReciteCardHTML(poem);
  slide.classList.add('expanded');

  bindCardEvents();

  setTimeout(() => overlay.classList.remove('active'), 300);
}

// 缩回 slide：切换为 PoemCard + 65% 宽
function collapseSlide(slideIndex) {
  const slide = swiper.slides[slideIndex];
  const poem = getPoemBySlideIndex(slideIndex);
  if (!poem) return;

  expandedSlideIndex = -1;
  viewMode = 'swiper';
  updateModeBadge();

  slide.classList.remove('expanded');
  // 等宽度动画结束后再换内容
  setTimeout(() => {
    slide.innerHTML = createPoemCardHTML(poem);
    bindCardEvents();
  }, 350);
}

function updateProgress() {
  const realIndex = swiper.realIndex + 1;
  document.getElementById('progressBar').textContent = `${realIndex} / ${poems.length}`;
}

function updateModeBadge() {
  const badge = document.getElementById('modeBadge');
  if (viewMode === 'swiper') {
    badge.textContent = '浏览模式';
    badge.className = 'mode-badge browse';
  } else {
    badge.textContent = '背诵模式';
    badge.className = 'mode-badge recite';
  }
}

// 绑定所有卡片事件
function bindCardEvents() {
  // PoemCard 点击 → 展开
  document.querySelectorAll('.poem-card').forEach(card => {
    const newCard = card.cloneNode(true);
    card.parentNode.replaceChild(newCard, card);
    newCard.addEventListener('click', () => {
      const poemId = parseInt(newCard.dataset.poemId);
      // 找到这个 poem 对应的 slide index
      const slideIndex = swiper.slides.findIndex(s => parseInt(s.dataset.poemId) === poemId);
      if (slideIndex !== -1) expandSlide(slideIndex);
    });
  });

  // RecitationCard 诗句点击
  document.querySelectorAll('.poem-line').forEach(line => {
    const newLine = line.cloneNode(true);
    line.parentNode.replaceChild(newLine, line);
    newLine.addEventListener('click', (e) => {
      e.stopPropagation();
      const poemId = parseInt(newLine.dataset.poemId);
      const lineIdx = parseInt(newLine.dataset.line);
      if (!currentLineMarks[poemId]) currentLineMarks[poemId] = {};
      const current = currentLineMarks[poemId][lineIdx];
      if (!current) currentLineMarks[poemId][lineIdx] = 'ok';
      else if (current === 'ok') currentLineMarks[poemId][lineIdx] = 'stuck';
      else if (current === 'stuck') currentLineMarks[poemId][lineIdx] = 'forgot';
      else if (current === 'forgot') currentLineMarks[poemId][lineIdx] = 'ok';

      if (expandedSlideIndex !== -1) {
        const poem = getPoemBySlideIndex(expandedSlideIndex);
        if (poem) {
          const slide = swiper.slides[expandedSlideIndex];
          slide.innerHTML = createReciteCardHTML(poem);
          bindCardEvents();
        }
      }
    });
  });

  // 返回按钮
  const backBtn = document.getElementById('backBtn');
  if (backBtn) {
    const newBtn = backBtn.cloneNode(true);
    backBtn.parentNode.replaceChild(newBtn, backBtn);
    newBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (expandedSlideIndex !== -1) collapseSlide(expandedSlideIndex);
    });
  }

  // 提交按钮
  const submitBtn = document.getElementById('submitBtn');
  if (submitBtn) {
    const newBtn = submitBtn.cloneNode(true);
    submitBtn.parentNode.replaceChild(newBtn, submitBtn);
    newBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const currentRealIndex = swiper.realIndex;
      if (currentRealIndex < poems.length - 1) {
        // 清除当前标记
        const poemId = parseInt(newBtn.closest('.recite-card').dataset.poemId);
        delete currentLineMarks[poemId];
        // 先缩回，再滑到下一首
        collapseSlide(expandedSlideIndex);
        setTimeout(() => {
          swiper.slideNext();
        }, 100);
      } else {
        collapseSlide(expandedSlideIndex);
      }
    });
  }
}

// 初始化
renderSlides();
initSwiper();
bindCardEvents();
updateProgress();
</script>
</body>
</html>
